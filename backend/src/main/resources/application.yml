spring:
  application:
    name: enterprise-lawfirm
  profiles:
    default: dev

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 21MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

# JWT Configuration
jwt:
  access-token-expiration: 900000  # 15 minutes in milliseconds
  refresh-token-expiration: 2592000000  # 30 days in milliseconds
  remember-me-expiration: 7776000000  # 90 days in milliseconds

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Mail (override per profile)
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Document Storage
app:
  storage:
    documents-path: ${user.home}/lawfirm-documents
    max-file-size-mb: 20

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
