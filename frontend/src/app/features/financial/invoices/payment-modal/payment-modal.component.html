<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
  <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl p-6 w-full max-w-md mx-4">
    <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-1">
      Marquer comme Payée
    </h3>
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">
      Facture {{ invoiceNumber }} — {{ totalAmount | number:'1.2-2' }} MAD
    </p>

    @if (error()) {
      <div class="mb-4 p-3 bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 rounded text-sm">
        {{ error() }}
      </div>
    }

    <div class="space-y-4">
      <!-- Payment Mode -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
          Mode de paiement <span class="text-red-500">*</span>
        </label>
        <select
          [ngModel]="paymentMode()"
          (ngModelChange)="paymentMode.set($event)"
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">Sélectionner...</option>
          @for (opt of paymentModeOptions; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </div>

      <!-- Payment Date -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
          Date de paiement <span class="text-red-500">*</span>
        </label>
        <input
          type="date"
          [ngModel]="paymentDate()"
          (ngModelChange)="paymentDate.set($event)"
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <!-- Reference (optional) -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
          Référence <span class="text-gray-400 text-xs">(optionnel)</span>
        </label>
        <input
          type="text"
          [ngModel]="paymentReference()"
          (ngModelChange)="paymentReference.set($event)"
          placeholder="Ex: VIR-2026-001"
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
    </div>

    <!-- Actions -->
    <div class="flex gap-3 mt-6 justify-end">
      <button
        (click)="cancelled.emit()"
        class="px-4 py-2 text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors"
      >
        Annuler
      </button>
      <button
        (click)="submit()"
        class="px-4 py-2 text-sm font-medium text-white bg-green-600 hover:bg-green-700 rounded-lg transition-colors"
      >
        Confirmer le paiement
      </button>
    </div>
  </div>
</div>
